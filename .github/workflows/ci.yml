# CI: run the whole-project test suite as a merge gate.
#
# Runs on every PR to main and on pushes to main. Make this check "required"
# in the repo's branch-protection settings so a red suite blocks the merge.
#
# The job installs only the light test dependencies (requirements-test.txt),
# not every role's full requirements -- FinBERT is stubbed and other heavy
# libs are importorskip-guarded, so the tests don't need them. Tests that load
# the DVC-tracked model artifacts skip automatically when those are absent.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run test suite
        run: pytest -q
