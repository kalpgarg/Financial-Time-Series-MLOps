# Prometheus scrape configuration for the prediction service.
#
# Prometheus polls the API's /metrics endpoint on the compose network. The
# target uses the compose service name `api`, resolvable inside the network.

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: stock-direction-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: nifty50-direction
