[project]
name = "financial-time-series-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── Orchestration & scraping ──────────────────────────────────────────────
    "apache-airflow>=2.10,<2.11",
    "crawl4ai>=0.6.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "tvdatafeed",
    "pyspark>=3.5.0",
    # ── Data & ML ─────────────────────────────────────────────────────────────
    "pandas>=2.1",
    "numpy>=1.26.0",
    "scipy>=1.18.1",
    "joblib>=1.5.3",
    "scikit-learn>=1.9.0",
    "xgboost>=3.4.1",
    "lightgbm>=4.7.0",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    # ── Experiment tracking & data versioning ─────────────────────────────────
    "mlflow>=3.15.1",
    "dvc>=3.67.1",
    # ── API & database ────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=1.4.36",
    "psycopg2-binary>=2.9",
    "prometheus-client>=0.21.0",
    # ── Shared ────────────────────────────────────────────────────────────────
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
tvdatafeed = { git = "https://github.com/rongardF/tvdatafeed.git" }

[dependency-groups]
dev = [
    "pytest>=8.3",
]
